<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
    <title>NutriTrack</title>
  </head>
  <body class="dashboard-body">
    <aside class="sidebar">
      <div class="logo"><i class="fas fa-leaf"></i><span>Nutri</span>Track</div>
      <nav class="menu">
        <ul>
          <li>
            <a href="/"><i class="fas fa-house"></i> Dashboard</a>
          </li>
          <li>
            <a href="/add-meal" class="active"
              ><i class="fas fa-utensils"></i> Meals</a
            >
          </li>
          <li>
            <a href="/history"><i class="fas fa-calendar-days"></i> History</a>
          </li>
          <li>
            <a href="/settings"><i class="fas fa-gear"></i> Settings</a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <h2 class="page-title">Add Meal</h2>
        <div class="top-nav-icons">
          <i class="far fa-bell"></i>
          <div class="user-avatar-small"><i class="fas fa-user"></i></div>
          <a href="/logout" title="Logout" style="color: inherit">
            <i class="fas fa-sign-out-alt"></i>
          </a>
        </div>
      </div>
      <!-- Meal Entry Interface: Allows users to input daily food consumption details -->
      <section class="meal-form-container">
        <div class="meal-card">
          <form method="post" action="/add-meal" id="add-meal-form">
            <div class="input-group">
              <label>Meal Name</label>
              <input
                type="text"
                placeholder="Write Meal Name..."
                name="meal_name"
                pattern=".*[a-zA-Z\u0600-\u06FF].*"
                title="Meal name must contain at least one letter (Arabic or English). Numbers alone are not allowed."
                required
              />
            </div>

            <div class="input-group">
              <label>Calories</label>
              <input
                type="number"
                placeholder="Calories Number"
                name="calories"
                min="1"
                oninput="validity.valid || (value = '')"
                required
              />
            </div>

            <div class="input-group">
              <label>Category</label>
              <input
                type="hidden"
                name="category"
                id="category-input"
                value="Healthy"
                required
              />
              <!-- Interactive Category Selection: Updates the hidden input field via JavaScript for form submission -->
              <div class="category-selector">
                <button
                  type="button"
                  class="cat-btn healthy-active"
                  data-value="Healthy"
                >
                  <i class="fas fa-leaf icon-healthy"></i> Healthy
                </button>
                <button type="button" class="cat-btn" data-value="Fast Food">
                  <i class="fas fa-bolt icon-fastfood"></i> Fast Food
                </button>
                <button type="button" class="cat-btn" data-value="Celebration">
                  <i class="fas fa-cake-candles icon-celebration"></i>
                  Celebration
                </button>
              </div>
            </div>

            <div class="input-group">
              <label>Time</label>
              <!-- Time Selection: Enhanced input wrapper for a better user experience with time-stamping -->
              <div class="time-input-wrapper">
                <input
                  type="text"
                  name="meal_time"
                  id="meal-time"
                  placeholder="e.g. 2:30 PM"
                  pattern="^(1[0-2]|0?[1-9]):([0-5][0-9])\s(AM|PM)$"
                  title="Please enter time in format: 10:30 AM"
                  required
                />
                <i class="far fa-clock"></i>
              </div>
            </div>
            <!-- Submission Trigger: Processes the meal entry and redirects back to the dashboard -->
            <button type="submit" class="submit-meal-btn">Log Meal</button>
          </form>
        </div>
      </section>
    </main>

    <script src="/static/js/main.js"></script>
  </body>
</html>
