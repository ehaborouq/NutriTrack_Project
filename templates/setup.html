<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
    <title>NutriTrack</title>
  </head>
  <body class="setup-body">
    <div class="setup-card">
      <h1>
        <i class="fas fa-leaf" style="color: #2d8569"></i>
        <span style="color: #2d8569">Nutri</span>Track
      </h1>
      <h2>Welcome to NutriTrack!</h2>
      <form action="/setup" method="POST">
        <label>What's your name?</label>
        <input
          type="text"
          name="name"
          placeholder="Your name..."
          pattern="^(?!\d+$)[A-Za-z0-9\s]+$"
          title="Name cannot be numbers only. Use letters or letters with numbers."
          required
        />

        <label>Daily Calorie Goal</label>
        <input
          type="number"
          name="goal"
          placeholder="Your calorie goal..."
          required
        />

        <button type="submit">Start My Journey</button>
      </form>
    </div>

    <script src="/static/js/main.js"></script>
  </body>
</html>
