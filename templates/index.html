<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
    <title>NutriTrack</title>
  </head>
  <body class="dashboard-body">
    <aside class="sidebar">
      <div class="logo"><i class="fas fa-leaf"></i><span>Nutri</span>Track</div>
      <nav class="menu">
        <ul>
          <li>
            <a href="/" class="active"
              ><i class="fas fa-house"></i> Dashboard</a
            >
          </li>
          <li>
            <a href="/add-meal"><i class="fas fa-utensils"></i> Meals</a>
          </li>
          <li>
            <a href="/history"><i class="fas fa-calendar-days"></i> History</a>
          </li>
          <li>
            <a href="/settings"><i class="fas fa-gear"></i> Settings</a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <h2 class="page-title">Dashboard</h2>

        <div class="top-nav-icons">
          <i class="far fa-bell"></i>
          <div class="user-avatar-small"><i class="fas fa-user"></i></div>
          <a href="/logout" title="Logout" style="color: inherit">
            <i class="fas fa-sign-out-alt"></i>
          </a>
        </div>
      </div>

      <header class="main-header">
        <h1>
          Welcome$$BACK$$, <span class="highlight">$$NAME$$!</span> $$ICON$$
        </h1>
      </header>

      <section class="circle-section">
        <div
          class="progress-circle $$STATUS_CLASS$$"
          style="--deg: $$PROGRESS$$deg"
        >
          <div class="circle-inner-content">
            <h2>$$TOTAL$$</h2>
            <p>/ $$GOAL$$ kcal</p>
          </div>
        </div>
        <p class="remaining-text">$$REMAINING$$ kcal left</p>
        <p class="nutrition-advice $$STATUS_CLASS$$">
          <i class="fas fa-info-circle"></i> $$ADVICE$$
        </p>
      </section>

      <section class="stats-row">
        <div class="stat-card">
          <p class="stat-label">Macros (P/C/F)</p>
          <div class="multi-bar">
            <div class="bar-segment protein"></div>
            <div class="bar-segment carbs"></div>
            <div class="bar-segment fat"></div>
          </div>
        </div>
        <div class="stat-card">
          <p class="stat-label">Activity Balance</p>
          <div class="single-bar-bg">
            <div class="bar-fill activity-fill"></div>
          </div>
        </div>
        <div class="stat-card">
          <p class="stat-label">Water Intake</p>
          <div class="single-bar-bg">
            <div class="bar-fill water-fill"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/js/main.js"></script>
  </body>
</html>
