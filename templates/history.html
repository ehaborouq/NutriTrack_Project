<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>NutriTrack</title>
  </head>
  <body class="dashboard-body">
    <aside class="sidebar">
      <div class="logo"><i class="fas fa-leaf"></i><span>Nutri</span>Track</div>
      <nav class="menu">
        <ul>
          <li>
            <a href="/"><i class="fas fa-house"></i> Dashboard</a>
          </li>
          <li>
            <a href="/add-meal"><i class="fas fa-utensils"></i> Meals</a>
          </li>
          <li>
            <a href="/history" class="active"
              ><i class="fas fa-calendar-days"></i> History</a
            >
          </li>
          <li>
            <a href="/settings"><i class="fas fa-gear"></i> Settings</a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <h2 class="page-title">Meal History</h2>
        <div class="top-nav-icons">
          <i class="far fa-bell"></i>
          <div class="user-avatar-small"><i class="fas fa-user"></i></div>
          <a href="/logout" title="Logout" style="color: inherit">
            <i class="fas fa-sign-out-alt"></i>
          </a>
        </div>
      </div>

      <section class="history-container">
        <div class="history-list" id="history-list">$$MEALS_LIST$$</div>
      </section>
    </main>

    <script src="/static/js/main.js"></script>
  </body>
</html>
