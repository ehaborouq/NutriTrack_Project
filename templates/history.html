<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
    <title>NutriTrack</title>
  </head>
  <body class="dashboard-body">
    <aside class="sidebar">
      <div class="logo"><i class="fas fa-leaf"></i><span>Nutri</span>Track</div>
      <nav class="menu">
        <ul>
          <li>
            <a href="/"><i class="fas fa-house"></i> Dashboard</a>
          </li>
          <li>
            <a href="/add-meal"><i class="fas fa-utensils"></i> Meals</a>
          </li>
          <li>
            <a href="/history" class="active"
              ><i class="fas fa-calendar-days"></i> History</a
            >
          </li>
          <li>
            <a href="/settings"><i class="fas fa-gear"></i> Settings</a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <h2 class="page-title">Meal History</h2>
        <div class="top-nav-icons">
          <i class="far fa-bell"></i>
          <div class="user-avatar-small"><i class="fas fa-user"></i></div>
        </div>
      </div>

      <section class="history-container">
        <div class="history-list" id="history-list">
          <div class="history-card healthy-border">
            <div class="card-main-info">
              <div class="card-icon-bg">
                <i class="fas fa-leaf icon-healthy"></i>
              </div>
              <div class="card-text">
                <h3>Grilled Chicken Salad</h3>
                <p>Today at 02:30 PM</p>
              </div>
            </div>
            <div class="card-right-side">
              <div class="card-stats">
                <span class="calories-amount">450</span>
                <span class="unit">kcal</span>
              </div>
              <button class="delete-btn" title="Delete Meal">
                <i class="far fa-trash-can"></i>
              </button>
            </div>
          </div>

          <div class="history-card fastfood-border">
            <div class="card-main-info">
              <div class="card-icon-bg">
                <i class="fas fa-bolt icon-fastfood"></i>
              </div>
              <div class="card-text">
                <h3>Cheese Burger</h3>
                <p>Yesterday at 08:15 PM</p>
              </div>
            </div>
            <div class="card-right-side">
              <div class="card-stats">
                <span class="calories-amount">850</span>
                <span class="unit">kcal</span>
              </div>
              <button class="delete-btn" title="Delete Meal">
                <i class="far fa-trash-can"></i>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/js/main.js"></script>
  </body>
</html>
