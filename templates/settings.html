<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- SweetAlert2 for confirming destructive actions like clearing history or deleting accounts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/static/css/style.css" />
    <title>NutriTrack</title>
  </head>
  <body class="dashboard-body">
    <aside class="sidebar">
      <div class="logo"><i class="fas fa-leaf"></i><span>Nutri</span>Track</div>
      <nav class="menu">
        <ul>
          <li>
            <a href="/"><i class="fas fa-house"></i> Dashboard</a>
          </li>
          <li>
            <a href="/add-meal"><i class="fas fa-utensils"></i> Meals</a>
          </li>
          <li>
            <a href="/history"><i class="fas fa-calendar-days"></i> History</a>
          </li>
          <li>
            <a href="/settings" class="active"
              ><i class="fas fa-gear"></i> Settings</a
            >
          </li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <h2 class="page-title">Settings</h2>
        <div class="top-nav-icons">
          <i class="far fa-bell"></i>
          <div class="user-avatar-small"><i class="fas fa-user"></i></div>
          <a href="/logout" title="Logout" style="color: inherit">
            <i class="fas fa-sign-out-alt"></i>
          </a>
        </div>
      </div>

      <section class="settings-layout">
        <div class="settings-column">
          <div class="settings-card">
            <h3 class="card-subtitle">
              <i class="fas fa-user-gear"></i> Profile & Goals
            </h3>
            <!-- User Profile Configuration: Updating name and daily nutritional targets -->
            <form id="profile-settings-form">
              <div class="input-group">
                <label>User Name</label>
                <input
                  type="text"
                  id="setting-username"
                  placeholder="Edit your name..."
                  pattern="^(?!\d+$)[A-Za-z0-9\s]+$"
                  title="Name cannot be numbers only."
                  required
                  maxlength="20"
                />
              </div>
              <div class="input-group">
                <label>Daily Calorie Goal (kcal)</label>
                <input
                  type="number"
                  id="setting-goal"
                  placeholder="e.g. 2500"
                  min="500"
                  max="10000"
                  required
                />
              </div>
              <button type="submit" class="save-btn">Update Profile</button>
            </form>
          </div>

          <div class="settings-card">
            <h3 class="card-subtitle">
              <i class="fas fa-comment-dots"></i> Coach Personality
            </h3>
            <!-- Personalization: User can choose the coach's tone which affects the dashboard feedback -->
            <select class="settings-select" id="coach-style">
              <option value="Motivator">The Motivator (Friendly)</option>
              <option value="Strict">The Drill Sergeant (Strict)</option>
              <option value="Comedian">The Comedian (Humorous)</option>
            </select>
          </div>
        </div>

        <div class="settings-column">
          <div class="settings-card">
            <h3 class="card-subtitle">
              <i class="fas fa-display"></i> Appearance
            </h3>
            <!-- Theme Management: Persistent Dark Mode toggle controlled via main.js -->
            <div class="toggle-option">
              <span>Dark Mode</span>
              <label class="switch">
                <input
                  type="checkbox"
                  id="darkModeToggle"
                  onclick="toggleDarkMode()"
                />
                <span class="slider round"></span>
              </label>
            </div>
          </div>

          <div class="settings-card danger-zone">
            <h3 class="card-subtitle">
              <i class="fas fa-triangle-exclamation"></i> Danger Zone
            </h3>
            <p class="danger-text">
              Actions here cannot be undone. Be careful!
            </p>

            <div class="danger-actions">
              <button class="danger-btn-outline" id="clear-history-btn">
                <i class="far fa-trash-can"></i> Clear All History
              </button>
              <button class="danger-btn-solid" id="reset-account-btn">
                <i class="fas fa-power-off"></i> Delete Account
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/js/main.js"></script>
  </body>
</html>
